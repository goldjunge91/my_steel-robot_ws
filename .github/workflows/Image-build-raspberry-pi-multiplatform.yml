name: Image Multi platform (Native)
run-name: ${{ github.actor }}-Image Multi platform (Native)
permissions:
  contents: read
  packages: write

env:
  REPO_NAME: my-steel-robot_raspberry_pi_multiplatform
  ROS_DISTRO: humble
  DOCKERHUB_USERNAME: goldjunge491

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - humble
      - "humble/**"
      - "feat_CI_CD"
    paths:
      - "docker/Dockerfile.robot-pi"
      - "docker/Dockerfile.**"
      - "docker/Dockerfile.robot-pi.v2"
      - ".github/workflows/image-build-raspberry-pi-multiplatform.yml"
  push:
    branches:
      - humble
      - "humble/**"
      - "feat_CI_CD"
    paths:
      - "docker/Dockerfile.*"
      - ".github/workflows/Image-build-raspberry-pi-multiplatform.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-image:
    name: Image Multi platform (Native)-(${{ matrix.dockerfile_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 Builds
          - dockerfile: docker/Dockerfile.robot-pi
            dockerfile_name: robot-pi
            platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64

          - dockerfile: docker/Dockerfile.robot-pi.v2
            dockerfile_name: robot-pi-v2
            platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64

          - dockerfile: docker/Dockerfile.hardware
            dockerfile_name: hardware
            platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64

          - dockerfile: docker/Dockerfile.simulation
            dockerfile_name: simulation
            platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64

          # ARM64 Builds (native runners)
          - dockerfile: docker/Dockerfile.robot-pi
            dockerfile_name: robot-pi
            platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64

          - dockerfile: docker/Dockerfile.robot-pi.v2
            dockerfile_name: robot-pi-v2
            platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64

          - dockerfile: docker/Dockerfile.hardware
            dockerfile_name: hardware
            platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64


    steps:
      - name: Check Docker Hub credentials
        id: check-secrets
        run: |
          if [ "${{ env.ACT }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Running in LOCAL mode with act - skipping credentials check"
          elif [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Missing Credentials::Missing DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN secrets. Skipping build."
            echo "⚠️  Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets. Skipping build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Docker Hub credentials found."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ steps.check-secrets.outputs.skip != 'true' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: ${{ steps.check-secrets.outputs.skip != 'true' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version Git tag
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          BUILD_DATE=$(date +%Y_%m_%d)
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            BUILD_TYPE="release"
            echo "✅ Building RELEASE from Git tag: v${VERSION}"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            VERSION="pr-${PR_NUMBER}"
            BUILD_TYPE="dev"
            echo "✅ Building from Pull Request #${PR_NUMBER}"
          else
            VERSION="${GITHUB_SHA:0:7}"
            BUILD_TYPE="dev"
            echo "✅ Building DEV version: ${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO_NAME }}
          tags: |
            type=raw,value=robot-pi-${{ matrix.dockerfile_name }}-${{ steps.version.outputs.build_type }}-${{ steps.version.outputs.version }}-${{ env.ROS_DISTRO }}-${{ matrix.arch }}-${{ steps.version.outputs.build_date }}
          labels: |
            org.opencontainers.image.title=my_steel Robot Image (${{ matrix.dockerfile_name }})
            org.opencontainers.image.description=CI build for ${{ matrix.platform }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.build_date }}

      - name: Build and push image [CI]
        if: ${{ steps.check-secrets.outputs.skip != 'true' && !env.ACT }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile_name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile_name }}-${{ matrix.arch }}

      - name: Build image [LOCAL]
        if: ${{ env.ACT }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile_name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile_name }}-${{ matrix.arch }}

      - name: Summarize build result
        if: ${{ steps.check-secrets.outputs.skip != 'true' || env.ACT }}
        run: |
          echo "## 🤖 Image Build (${{ matrix.dockerfile_name }}-${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Build completed successfully.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Build failed.** Check the logs above for details." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Details" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "**Platform:** ${{ matrix.platform }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Runner:** ${{ matrix.runner }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Dockerfile:** ${{ matrix.dockerfile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build Date:** ${{ steps.version.outputs.build_date }}" >> "$GITHUB_STEP_SUMMARY"






