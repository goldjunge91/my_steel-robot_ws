name: Image Build Raspberry Pi (Multi-Platform)
run-name: ${{ github.actor }} is building Multi-Platform Images
permissions:
  contents: read
  packages: write

on:
  pull_request:
    types:
      - opened
    branches:
      - humble
      - "humble/**"
      - "feat_CI_CD"
    paths:
      - "docker/Dockerfile.robot-pi"
      - "docker/Dockerfile.**"
      - "docker/Dockerfile.robot-pi.v2"
      - ".github/workflows/image-build-raspberry-pi-multiplatform.yml"
  push:
    tags:
      - "v*.*.*"
    paths:
      - "docker/Dockerfile.**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build-image:
    name: Build Multi-Platform Image (${{ matrix.dockerfile_name }})
    runs-on: ubuntu-22.04  # Oder ubuntu-22.04-arm für native ARM
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile.robot-pi
            dockerfile_name: robot-pi
            repo_name: my-steel-robot
            platforms: linux/amd64,linux/arm64
            ros_distro: humble

          - dockerfile: docker/Dockerfile.robot-pi.v2
            dockerfile_name: robot-pi-v2
            repo_name: my-steel-robot
            platforms: linux/amd64,linux/arm64
            ros_distro: humble

          - dockerfile: docker/Dockerfile.hardware
            dockerfile_name: hardware
            repo_name: my-steel-robot
            platforms: linux/amd64,linux/arm64
            ros_distro: humble

          - dockerfile: docker/Dockerfile.simulation
            dockerfile_name: simulation
            repo_name: my-steel-robot
            platforms: linux/amd64,linux/arm64
            ros_distro: humble

    steps:
      - name: Check Docker Hub credentials
        id: check-secrets
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          if [ "${{ env.ACT }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Running in LOCAL mode with act - skipping credentials check"
          elif [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Missing Credentials::Missing DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN secrets. Skipping build."
            echo "⚠️  Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets. Skipping build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Docker Hub credentials found for ${{ secrets.DOCKERHUB_USERNAME }}"
          fi

      - name: Checkout repository
        if: ${{ steps.check-secrets.outputs.skip != 'true' || env.ACT }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        if: ${{ steps.check-secrets.outputs.skip != 'true' || env.ACT }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ steps.check-secrets.outputs.skip != 'true' || env.ACT }}
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ steps.check-secrets.outputs.skip != 'true' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version Git tag
        if: steps.check-secrets.outputs.skip != 'true'
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "✅ Building from Git tag: v${VERSION}"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            VERSION="pr-${PR_NUMBER}"
            echo "✅ Building from Pull Request #${PR_NUMBER}"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
            echo "✅ Building development version: ${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "git_tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.repo_name }}
          tags: |
            type=raw,value=${{ matrix.ros_distro }}-${{ steps.version.outputs.version }}-${{ matrix.dockerfile_name }}-${{ steps.version.outputs.build_date }}
            type=raw,value=${{ matrix.ros_distro }}-${{ steps.version.outputs.version }}-${{ matrix.dockerfile_name }}
            type=raw,value=${{ matrix.ros_distro }}-latest-${{ matrix.dockerfile_name }}

      - name: Build and push Multi-Platform image [CI]
        if: ${{ steps.check-secrets.outputs.skip != 'true' && !env.ACT }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-steel-robot:${{ matrix.dockerfile_name }}-multi-${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.dockerfile_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile_name }}
          labels: |
            org.opencontainers.image.title=my_steel Robot Image (Multi-Platform)
            org.opencontainers.image.description=Multi-platform build (${{ matrix.platforms }})
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build Multi-Platform image [LOCAL]
        if: ${{ env.ACT }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
          load: true
          tags: goldjunge491/my-steel-robot:${{ matrix.dockerfile_name }}-local-multi
          cache-from: type=gha,scope=${{ matrix.dockerfile_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile_name }}
          labels: |
            org.opencontainers.image.title=my_steel Robot Image (LOCAL Multi-Platform)
            org.opencontainers.image.description=Local multi-platform build (${{ matrix.platforms }})
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summarize build result
        if: ${{ steps.check-secrets.outputs.skip != 'true' || env.ACT }}
        run: |
          echo "## 🤖 Multi-Platform Image Build (${{ matrix.dockerfile_name }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Build completed successfully.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Build failed.** Check the logs above for details." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Details" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** ${{ secrets.DOCKERHUB_USERNAME }}/my-steel-robot:${{ matrix.dockerfile_name }}-multi-${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** ${{ matrix.platforms }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Dockerfile:** ${{ matrix.dockerfile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"