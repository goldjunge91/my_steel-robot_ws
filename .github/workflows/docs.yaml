name: docs

on:
  release:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: false
      - name: Set up Python
        run: uv python install 3.13

      - name: Install MkDocs dependencies
        run: |
          uv sync --only-group docs

      - name: Build and push docs
        uses: athackst/mkdocs-simple-plugin@v3.2.0
        with:
          mkdocs_config: mkdocs.yml

      - name: Add deployment info
        if: success()
        run: |
          echo "📚 Documentation deployed to: https://goldjunge91.github.io/my_steel-robot_ws/" >> $GITHUB_STEP_SUMMARY
