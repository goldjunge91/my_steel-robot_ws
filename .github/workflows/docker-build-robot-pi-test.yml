---
name: Build Robot Pi Test Image

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "docker/Dockerfile.robot-pi.test"
      - "docker/compose.robot-pi.test.yaml"
      - "docker/README.md"
      - "build.sh"
      - "src/**"
      - ".github/workflows/docker-build-robot-pi-test.yml"
  push:
    branches:
      - main
      - humble
      - feat_CI_CD
    paths:
      - "docker/Dockerfile.robot-pi.test"
      - "docker/compose.robot-pi.test.yaml"
      - "docker/README.md"
      - "build.sh"
      - "src/**"
      - ".github/workflows/docker-build-robot-pi-test.yml"
  workflow_dispatch:

jobs:
  build-test-image:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Check Docker Hub credentials
        id: check-secrets
        run: |
          if [ "${{ env.ACT }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "🧪 Running in LOCAL mode with act - skipping credentials check"
          elif [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  Missing DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN secrets. Skipping build."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Robot Pi Test Image (CI build)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️  Skipped because Docker Hub credentials are not configured." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "To enable this workflow:" >> "$GITHUB_STEP_SUMMARY"
            echo "- Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets in the repository settings." >> "$GITHUB_STEP_SUMMARY"
            echo "- Ensure the Docker Hub repository exists (e.g. ${GITHUB_REPOSITORY_OWNER}/robot)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Docker Hub credentials found for ${{ secrets.DOCKERHUB_USERNAME }}"
          fi

      - name: Checkout repository
        if: ${{ steps.check-secrets.outputs.skip != 'true' || env.ACT }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        if: ${{ steps.check-secrets.outputs.skip != 'true' || env.ACT }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # - name: Set up Docker Buildx
      #   if: ${{ steps.check-secrets.outputs.skip != 'true' || env.ACT }}
      #   id: buildx
      #   uses: docker/setup-buildx-action@v3

      - name: Set up Docker Buildx
        if: ${{ steps.check-secrets.outputs.skip != 'true' || env.ACT }}
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
          install: true
      - name: Bootstrap Buildx (start workers)
        if: ${{ steps.check-secrets.outputs.skip != 'true' || env.ACT }}
        run: |
          docker buildx use ${{ steps.buildx.outputs.name }}
          docker buildx inspect --bootstrap
          docker buildx ls

      - name: Log in to Docker Hub
        if: ${{ steps.check-secrets.outputs.skip != 'true' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build robot-pi test image (arm64) [CI]
        if: ${{ steps.check-secrets.outputs.skip != 'true' && !env.ACT }}
        id: build-ci
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: docker/Dockerfile.robot-pi.test
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-steel-robot:pi-test-ci
          labels: |
            org.opencontainers.image.title=my_steel Robot Test Image
            org.opencontainers.image.description=CI build of the Raspberry Pi test image (linux/arm64)
            org.opencontainers.image.revision=${{ github.sha }}

        # with:
        #   context: .
        #   file: docker/Dockerfile.robot-pi.test
        #   platforms: linux/arm64
        #   push: true
        #   tags: ${{ secrets.DOCKERHUB_USERNAME }}/robot:pi-test-ci
        #   labels: |
        #     org.opencontainers.image.title=my_steel Robot Test Image
        #     org.opencontainers.image.description=CI build of the Raspberry Pi test image (linux/arm64)
        #     org.opencontainers.image.revision=${{ github.sha }}

      - name: Build robot-pi test image (arm64) [LOCAL]
        if: ${{ env.ACT }}
        id: build-local
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.robot-pi.test
          platforms: linux/arm64
          push: false
          load: true
          tags: goldjunge491/my-steel-robot:pi-test-local
          labels: |
            org.opencontainers.image.title=my_steel Robot Test Image (LOCAL)
            org.opencontainers.image.description=Local build with act (linux/arm64)
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summarize build result
        if: ${{ steps.check-secrets.outputs.skip != 'true' || env.ACT }}
        run: |
          {
            echo "## Robot Pi Test Image (build)"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Build completed successfully."
            else
              echo "❌ Build failed. Check the logs above for details."
            fi
            echo ""
            if [ "${{ env.ACT }}" = "true" ]; then
              echo "- Mode: LOCAL (image loaded as \`goldjunge491/my-steel-robot:pi-test-local\`)"
              echo "- Dockerfile: \`docker/Dockerfile.robot-pi.test\`"
              echo "- Platform: \`linux/arm64\`"
            else
              echo "- Mode: CI (pushed tag: \`${{ secrets.DOCKERHUB_USERNAME }}/my-steel-robot:pi-test-ci\`)"
              echo "- Dockerfile: \`docker/Dockerfile.robot-pi.test\`"
              echo "- Platform: \`linux/arm64\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
