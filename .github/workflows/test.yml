name: Image Build - Raspberry Pi (Multi-Platform)
run-name: ${{ github.actor }} is building multi-platform images (Native)
permissions:
  contents: read
  packages: write

on:
  pull_request:
    types:
      - closed
    branches:
      - humble
      - "humble/**"
      - "feat_CI_CD"
    paths:
      - "docker/Dockerfile.robot-pi"
      - "docker/Dockerfile.robot-pi.v2"
      - "docker/Dockerfile.hardware"
      - "docker/Dockerfile.simulation"
      - ".github/workflows/image-build-raspberry-pi.yml"
  push:
    tags:
      - "v*.*.*"
    paths:
      - "docker/Dockerfile.*"
      - "docker/compose.robot-pi.yaml"
  workflow_dispatch:

jobs:
  # JOB 1: BAUT JEDE PLATTFORM SEPARAT AUF NATIVEN RUNNERN
  build:
    name: Build ${{ matrix.dockerfile_name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # Notwendig für Push-by-Digest
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 Builds
          - dockerfile: docker/Dockerfile.robot-pi
            dockerfile_name: robot-pi
            repo_name: my-steel-robot
            platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64
            ros_distro: humble
          - dockerfile: docker/Dockerfile.robot-pi.v2
            dockerfile_name: robot-pi-v2
            repo_name: my-steel-robot
            platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64
            ros_distro: humble
          - dockerfile: docker/Dockerfile.hardware
            dockerfile_name: hardware
            repo_name: my-steel-robot
            platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64
            ros_distro: humble
          - dockerfile: docker/Dockerfile.simulation
            dockerfile_name: simulation
            repo_name: my-steel-robot
            platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64
            ros_distro: humble

          # ARM64 Builds (native runners)
          - dockerfile: docker/Dockerfile.robot-pi
            dockerfile_name: robot-pi
            repo_name: my-steel-robot
            platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64
            ros_distro: humble
          - dockerfile: docker/Dockerfile.robot-pi.v2
            dockerfile_name: robot-pi-v2
            repo_name: my-steel-robot
            platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64
            ros_distro: humble
          - dockerfile: docker/Dockerfile.hardware
            dockerfile_name: hardware
            repo_name: my-steel-robot
            platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64
            ros_distro: humble
          - dockerfile: docker/Dockerfile.simulation
            dockerfile_name: simulation
            repo_name: my-steel-robot
            platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64
            ros_distro: humble

    steps:
      - name: Check Docker Hub credentials
        id: check-secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Missing Credentials::Missing DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN secrets. Skipping build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.check-secrets.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check-secrets.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        if: steps.check-secrets.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }} # Baut nur die eine, native Plattform
          push: true
          # Pusht nur mit Digest, nicht mit Tag
          outputs: type=image,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.dockerfile_name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile_name }}-${{ matrix.arch }}

      - name: Export digest
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          # Erstellt eine leere Datei mit dem Digest als Namen
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          # Einzigartiger Name für diesen Build, z.B. "digests-robot-pi-amd64"
          name: digests-${{ matrix.dockerfile_name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # JOB 2: FÜHRT MANIFESTS ZUSAMMEN, NACHDEM ALLE BUILDS FERTIG SIND
  merge:
    name: Merge Manifests
    runs-on: ubuntu-latest
    needs: build # Startet erst, wenn Job 'build' komplett fertig ist
    strategy:
      fail-fast: false
      matrix:
        # Führt diesen Job 4x aus, einmal pro Image-Typ
        dockerfile_name: [robot-pi, robot-pi-v2, hardware, simulation]
        include:
          - dockerfile_name: robot-pi
            repo_name: my-steel-robot
            ros_distro: humble
          - dockerfile_name: robot-pi-v2
            repo_name: my-steel-robot
            ros_distro: humble
          - dockerfile_name: hardware
            repo_name: my-steel-robot
            ros_distro: humble
          - dockerfile_name: simulation
            repo_name: my-steel-robot
            ros_distro: humble

    steps:
      - name: Check Docker Hub credentials
        id: check-secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Missing Credentials::Missing DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN secrets. Skipping merge."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          # Lädt nur die Artifacts für diesen Job herunter, z.B. "digests-robot-pi-*"
          pattern: digests-${{ matrix.dockerfile_name }}-*
          merge-multiple: true

      - name: Log in to Docker Hub
        if: steps.check-secrets.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Brauchen die Versions-Infos hier erneut für die finalen Tags
      - name: Extract version Git tag
        if: steps.check-secrets.outputs.skip != 'true'
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            VERSION="pr-${PR_NUMBER}"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata (final tags)
        if: steps.check-secrets.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.repo_name }}
          # Dies sind die finalen, sauberen Multi-Arch-Tags
          tags: |
            type=raw,value=${{ matrix.dockerfile_name }}-${{ matrix.ros_distro }}-${{ steps.version.outputs.version }}
            type=raw,value=${{ matrix.dockerfile_name }}-${{ matrix.ros_distro }}-latest
          # Wichtig für den 'jq' Befehl unten
          flavor: |
            latest=false

      - name: Create manifest list and push
        if: steps.check-secrets.outputs.skip != 'true'
        env:
          # Übergibt die JSON-Ausgabe des meta-Schritts an den 'jq'-Befehl
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.repo_name }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Prüfen, ob Digests heruntergeladen wurden
          if [ -z "$(ls)" ]; then
            echo "::error::No digests found to merge for ${{ matrix.dockerfile_name }}. Aborting."
            exit 1
          fi

          echo "Downloaded digests:"
          ls -l

          # Erstellt die Tag-Argumente, z.B. "-t user/app:tag1 -t user/app:tag2"
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          # Erstellt die Digest-Liste, z.B. "user/app@sha256:digest1 user/app@sha256:digest2"
          # Der '*' erweitert sich zu den Dateinamen, die die Digests sind
          DIGESTS=$(printf "$REGISTRY_IMAGE@sha256:%s " *)

          echo "Merging tags: $TAGS"
          echo "Merging digests: $DIGESTS"

          docker buildx imagetools create $TAGS $DIGESTS
