site_name: "my_steel Robot Documentation"
site_url: "https://goldjunge91.github.io/my_steel-robot_ws"
repo_url: "https://github.com/goldjunge91/my_steel-robot_ws"
repo_name: goldjunge91/my_steel-robot_ws
site_description: "Documentation"
dev_addr: "127.0.0.1:8080"
docs_dir: docs/doc

theme:
  name: shadcn
  icon: heroicons:rocket-launch
  show_title: true
  show_stargazers: true
  pygments_style:
    light: shadcn-light
    dark: github-dark
  katex_options:
    macros:
      "\\dx": "\\mathrm{d}x"
  # show_datetime: true

# nav:
#   - Welcome: index.md
#   - get_started.md
#   - Extensions:
#       - Footnotes: extensions/footnotes.md
#       - Tabs: extensions/pymdownx_blocks_tab.md
#       - Details: extensions/pymdownx_blocks_details.md
#       - Codexec: extensions/codexec.md

plugins:
  - search
  - excalidraw:
      directory: docs/doc/excalidraw      
  - mkdocstrings
  - mermaid2:
        arguments:
          theme: dark
  - panzoom:
      hint_location: "top"
      always_show_hint: true
      images: true
      full_screen: false
      initial_zoom_level: -0.5

markdown_extensions:
  admonition:
  attr_list:
  codehilite:
  fenced_code:
  footnotes:
  extra:
  pymdownx.blocks.details:
  pymdownx.tabbed:
  pymdownx.blocks.tab:
    combine_header_slug: true
    separator: ___
  pymdownx.progressbar:
  pymdownx.snippets:
  pymdownx.arithmatex:
    generic: true
  shadcn.extensions.echarts.alpha:
  shadcn.extensions.codexec:
  shadcn.extensions.iconify:
  pymdownx.blocks.caption:
  # shadcn.extensions.echarts.alpha:
  shadcn.extensions.echarts.alpha:
  pymdownx.superfences:
    preserve_tabs: true
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:mermaid2.fence_mermaid
